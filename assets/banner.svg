<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" fill="none" role="img" aria-label="dayeon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ec"/>
      <stop offset="0.5" stop-color="#ece0ff"/>
      <stop offset="1" stop-color="#d9f6ff"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9ec7"/>
      <stop offset="1" stop-color="#ff9ec7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="2" y="2" width="796" height="256" rx="32" fill="url(#bg)" stroke="#ffffff" stroke-width="4"/>

  <!-- twinkling sparkles -->
  <g fill="#ffd36e">
    <g transform="translate(120 70)">
      <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
      <animateTransform attributeName="transform" type="translate" values="120 70;120 60;120 70" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(680 90)">
      <path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(640 180)">
      <path d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating hearts -->
  <g fill="#ff9ec7">
    <g transform="translate(180 185)">
      <path d="M0 4 C-6 -4 -14 2 0 12 C14 2 6 -4 0 4 Z"/>
      <animateTransform attributeName="transform" type="translate" values="180 185;180 173;180 185" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(610 60)" fill="#c9b6ff">
      <path d="M0 3 C-5 -3 -11 1 0 9 C11 1 5 -3 0 3 Z"/>
      <animateTransform attributeName="transform" type="translate" values="610 60;610 50;610 60" dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- cute character -->
  <g transform="translate(400 118)">
    <!-- gentle bob -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite" additive="sum"/>
    <!-- ears -->
    <path d="M-66 -52 L-40 -78 L-30 -44 Z" fill="#fff6fb" stroke="#ffb3d1" stroke-width="4" stroke-linejoin="round"/>
    <path d="M66 -52 L40 -78 L30 -44 Z" fill="#fff6fb" stroke="#ffb3d1" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-54 -54 L-40 -68 L-35 -48 Z" fill="#ffd1e3"/>
    <path d="M54 -54 L40 -68 L35 -48 Z" fill="#ffd1e3"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="82" ry="74" fill="#fff6fb" stroke="#ffb3d1" stroke-width="4"/>
    <!-- blush -->
    <ellipse cx="-42" cy="18" rx="18" ry="11" fill="url(#blush)"/>
    <ellipse cx="42" cy="18" rx="18" ry="11" fill="url(#blush)"/>
    <!-- eyes (blink) -->
    <g fill="#5b5570">
      <ellipse cx="-28" cy="-4" rx="8" ry="11">
        <animate attributeName="ry" values="11;11;11;1;11;11" keyTimes="0;0.85;0.9;0.93;0.96;1" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="28" cy="-4" rx="8" ry="11">
        <animate attributeName="ry" values="11;11;11;1;11;11" keyTimes="0;0.85;0.9;0.93;0.96;1" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- eye shine -->
    <circle cx="-25" cy="-8" r="2.4" fill="#fff"/>
    <circle cx="31" cy="-8" r="2.4" fill="#fff"/>
    <!-- smile -->
    <path d="M-12 18 Q0 30 12 18" stroke="#5b5570" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- name -->
  <text x="400" y="232" text-anchor="middle" font-family="'Comic Sans MS','Segoe UI Rounded','Segoe UI',system-ui,sans-serif" font-size="26" font-weight="700" fill="#c77dcb" letter-spacing="3">✧ dayeon ✧</text>
</svg>
